<style>
  :root{
    --bg:#efe7db;
    --paper:#f7f2e8;
    --gold:#b08a44;
    --gold-2:#8d6c2f;
    --ink:#4a3a24;
    --ink-2:#6b5738;
    --label:#8a7452;
    --line:rgba(176,138,68,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Frank Ruhl Libre',Georgia,serif;
    min-height:100svh;
    background-image:radial-gradient(70% 50% at 50% 30%,rgba(255,255,255,.6),transparent 70%);
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  .page{
    width:min(470px,calc(100vw - 28px));margin:0 auto;
    padding:clamp(24px,5vh,56px) 0 72px;
    display:flex;flex-direction:column;align-items:center;gap:44px;
  }

  /* ---------- מעטפה ---------- */
  .stage{
    width:100%;min-height:calc(100svh - 96px);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:10svh;
    transition:min-height 1s cubic-bezier(.55,.05,.15,1),padding 1s cubic-bezier(.55,.05,.15,1);
  }
  .out .stage{min-height:0;padding-bottom:0}
  .env-wrap{
    position:relative;width:100%;aspect-ratio:470/330;
    perspective:1600px;perspective-origin:50% 30%;
    transition:height 1.1s cubic-bezier(.55,.05,.15,1);
  }
  .env-wrap > *{position:absolute}
  .back{inset:0;background:#e8ddc9;border-radius:3px;box-shadow:0 34px 70px -26px rgba(74,58,36,.5);z-index:1}
  .invite{
    position:relative;width:100%;aspect-ratio:1060/1484;
    background:var(--paper);overflow:hidden;
    box-shadow:0 34px 70px -26px rgba(74,58,36,.45);
  }
  .invite img{display:block;width:100%;height:100%;object-fit:cover}
  .env-wrap .invite{
    position:absolute;left:8%;width:84%;bottom:5%;top:auto;z-index:2;
    box-shadow:0 10px 30px rgba(74,58,36,.2);
    clip-path:inset(44% 0 0 0);
    transition:transform 1.4s cubic-bezier(.55,.05,.15,1) .5s, clip-path 1.4s cubic-bezier(.55,.05,.15,1) .5s, box-shadow .6s;
  }
  .pocket{
    inset:0;z-index:3;background:var(--paper);border-radius:3px;pointer-events:none;
    clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
    filter:drop-shadow(0 -1px 2px rgba(74,58,36,.14));
  }
  .pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(74,58,36,.09),rgba(74,58,36,0) 45%);clip-path:polygon(0 0,50% 54%,100% 0)}
  .addr{
    left:0;right:0;top:64%;text-align:center;z-index:4;pointer-events:none;
    font-size:clamp(17px,4.6vw,23px);font-weight:500;color:var(--gold-2);letter-spacing:.02em;
  }
  .addr small{display:block;font-size:.62em;font-weight:400;color:var(--label);margin-top:6px;font-family:'Heebo',sans-serif;letter-spacing:.12em}
  .flap{
    left:0;right:0;top:0;height:56%;z-index:5;
    background:var(--paper);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    filter:drop-shadow(0 4px 4px rgba(74,58,36,.2));
    transition:transform 1.1s cubic-bezier(.55,.05,.15,1), z-index 0s linear .55s;
  }
  .flap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(74,58,36,.05));clip-path:polygon(0 0,100% 0,50% 100%)}
  .crown{
    left:50%;top:26%;transform:translate(-50%,-50%);
    width:clamp(44px,11vw,62px);z-index:6;color:var(--gold);
    transition:opacity .5s;
  }
  .env-btn{inset:0;z-index:7;background:none;border:0;border-radius:3px;cursor:pointer}
  .env-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:10px}
  .hint{margin-top:30px;font-family:'Heebo',sans-serif;font-size:12px;letter-spacing:.22em;color:var(--label);transition:opacity .4s}

  .open .flap{transform:rotateX(180deg);z-index:0}
  .open .crown{opacity:0}
  .open .env-wrap .invite{transform:translateY(-58%);clip-path:inset(0 0 0 0)}
  .open .hint{opacity:0}
  .out .env-wrap .invite{
    left:0;width:100%;top:0;bottom:auto;z-index:8;transform:none;clip-path:inset(0 0 0 0);
    box-shadow:0 34px 70px -26px rgba(74,58,36,.45);
    transition:left 1.1s cubic-bezier(.55,.05,.15,1), width 1.1s cubic-bezier(.55,.05,.15,1), transform 1.1s cubic-bezier(.55,.05,.15,1), box-shadow .8s;
  }
  .out .back,.out .pocket,.out .addr,.out .flap,.out .crown{transition:opacity .6s,transform .9s cubic-bezier(.55,.05,.15,1);opacity:0;transform:translateY(10%)}
  .out .env-btn,.out .hint{display:none}

  /* ---------- אישור הגעה ---------- */
  .rsvp{
    position:relative;width:100%;background:var(--paper);
    box-shadow:0 34px 70px -26px rgba(74,58,36,.45);
    border:1px solid rgba(176,138,68,.35);
    opacity:0;transition:opacity .9s ease .5s;
  }
  .out .rsvp{opacity:1}
  .rsvp::before{content:"";position:absolute;inset:7px;border:1px solid rgba(176,138,68,.4);pointer-events:none}
  .rsvp .in{position:relative;padding:44px 9% 48px;display:flex;flex-direction:column;gap:24px}
  .head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .ttl{font-size:27px;font-weight:500;color:var(--gold-2)}
  .orn{width:100%;max-width:200px;color:var(--gold)}
  .by{font-size:19px;color:var(--ink-2)}
  form{display:flex;flex-direction:column;gap:19px}
  .f{display:flex;flex-direction:column;gap:5px}
  .lb{font-family:'Heebo',sans-serif;font-size:11px;letter-spacing:.14em;color:var(--label)}
  input[type=text],input[type=email],input[type=number],textarea{
    width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
    font-family:'Frank Ruhl Libre',Georgia,serif;font-size:19px;padding:7px 0;outline:none;color:var(--ink);border-radius:0;
  }
  input:focus,textarea:focus{border-bottom-color:var(--gold-2)}
  textarea{resize:none}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice label{
    border:1px solid var(--line);padding:13px 8px;text-align:center;font-size:17px;cursor:pointer;
    transition:background .2s,color .2s;position:relative;
  }
  .choice input{position:absolute;opacity:0;width:0;height:0}
  .choice label:hover{background:rgba(176,138,68,.1)}
  .choice label:has(input:checked){background:var(--gold-2);color:#fdf9f1;border-color:var(--gold-2)}
  .choice label:has(input:focus-visible){outline:2px solid var(--gold-2);outline-offset:2px}
  .two{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}
  .send{
    background:var(--gold-2);color:#fdf9f1;text-align:center;padding:15px;border:0;
    font-family:'Heebo',sans-serif;font-size:14px;letter-spacing:.14em;transition:background .2s;
  }
  .send:hover{background:var(--ink)}
  .send[disabled]{opacity:.55;cursor:default}
  .send:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .status{text-align:center;font-size:18px;color:var(--ink-2);min-height:1.4em;margin-top:-6px}
  .status.err{color:#9b3a2b}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
  .links a{font-family:'Heebo',sans-serif;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:3px;color:var(--ink-2);transition:color .2s,border-color .2s}
  .links a:hover{color:var(--gold-2);border-color:var(--gold-2)}
  .links a:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
  .links span{color:var(--line)}
  .thanks{display:none;text-align:center;font-size:21px;line-height:1.5;padding:6px 0 4px}
  .thanks .big{display:block;font-size:26px;font-weight:500;color:var(--gold-2);margin-bottom:10px}
  .done form,.done .by{display:none}
  .done .thanks{display:block}
  .hp{position:absolute;right:-9999px}
  @media (prefers-reduced-motion:reduce){.flap,.env-wrap .invite,.back,.pocket,.addr,.crown,.env-wrap,.stage{transition:none !important}}
</style>
</head>

<script>
  // מעטפה
  const page = document.getElementById('page');
  const env = document.getElementById('env');
  let opened = false;
  function openEnvelope(){
    if (opened) return; opened = true;
    env.style.height = env.offsetHeight + 'px';
    page.classList.add('open');
    setTimeout(()=>{
      page.classList.add('out');
      env.style.height = Math.round(env.offsetWidth * 1484 / 1060) + 'px';
    }, 2100);
  }
  document.getElementById('openBtn').addEventListener('click', openEnvelope);

  // יומן: 26.10.26, 9:00 בבוקר שעון דאלאס (CDT) = 14:00 UTC
  const title = "עלייה לתורה - בן מרדכי כהן";
  const loc = "בית הכנסת אחדות ישראל, 5821 McShann Rd, Dallas, TX 75230";
  const start = "20261026T140000Z", end = "20261026T160000Z";
  document.getElementById('gcal').href =
    "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) +
    "&dates=" + start + "/" + end + "&location=" + encodeURIComponent(loc);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Aliyah//Invite//EN","BEGIN:VEVENT",
    "UID:aliyah-2026@invite","DTSTAMP:"+start,"DTSTART:"+start,"DTEND:"+end,
    "SUMMARY:"+title,"LOCATION:"+loc.replace(/,/g,"\\,"),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  document.getElementById('ics').href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);

  // טופס
  const form = document.getElementById('rsvpForm');
  const status = document.getElementById('status');
  const sendBtn = document.getElementById('sendBtn');
  const guests = document.getElementById('guests');
  form.querySelectorAll('input[name="הגעה"]').forEach(r =>
    r.addEventListener('change', () => { guests.closest('label').style.visibility = r.value.indexOf('לא') === 0 && r.checked ? 'hidden' : ''; }));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    status.className = 'status';
    const name = document.getElementById('name').value.trim();
    const att = form.querySelector('input[name="הגעה"]:checked');
    if (!name){ status.textContent = 'נא למלא שם.'; status.classList.add('err'); return; }
    if (!att){ status.textContent = 'נא לבחור אם תגיעו.'; status.classList.add('err'); return; }
    document.getElementById('subj').value = 'אישור הגעה: ' + name + ' - ' + att.value;
    sendBtn.disabled = true; status.textContent = 'שולח...';
    try{
      const res = await fetch('https://formsubmit.co/ajax/osnat20012@gmail.com', {method:'POST', headers:{'Accept':'application/json'}, body:new FormData(form)});
      const data = await res.json();
      if (res.ok && String(data.success) === 'true'){
        document.getElementById('thanksMsg').textContent = att.value.indexOf('לא') === 0
          ? 'תודה שהודעתם. נתגעגע אליכם.'
          : 'תודה רבה, ' + name + '. נשמח לראותכם בין אורחינו.';
        document.getElementById('rsvp').classList.add('done');
        document.getElementById('thanks').scrollIntoView({behavior:'smooth', block:'center'});
      } else { throw new Error(data.message || 'send failed'); }
    }catch(err){
      status.textContent = 'משהו השתבש. נסו שוב. ';
      const why = document.createElement('span');
      why.dir = 'ltr'; why.style.unicodeBidi = 'isolate'; why.style.display = 'inline-block';
      why.textContent = '(' + (err.message || 'שגיאת רשת') + ')';
      status.appendChild(why);
      status.classList.add('err'); sendBtn.disabled = false;
    }
  });
</script>
